<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Thumbnails Gallery</title>
  <style>
    body{font-family:system-ui;padding:1rem;background:#f6f8fb}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
    .card{background:#fff;padding:6px;border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,0.06)}
    img{width:100%;height:auto;display:block;border-radius:4px}
    .muted{color:#667}
  </style>
</head>
<body>
  <h1>Thumbnails Gallery</h1>
  <p class="muted">Filenames are hashed for privacy.</p>
  <div id="grid" class="grid"></div>
  <script>
    async function load() {
      try {
        const res = await fetch('./assets/thumbnails/index.json');
        if (!res.ok) throw new Error('index.json not found');
        const files = await res.json();
        const grid = document.getElementById('grid');
        files.forEach(fn=>{
          const div = document.createElement('div'); div.className='card';
          const img = document.createElement('img'); img.src = './assets/thumbnails/'+fn;
          div.appendChild(img);
          grid.appendChild(div);
        });
      } catch(e) {
        document.getElementById('grid').innerText = 'No thumbnails index found. '+ e;
      }
    }
    load();
  </script>
</body>
</html>
