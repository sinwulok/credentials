<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Credentials — Thumbnails</title>
  <style>
    body{font-family:system-ui, -apple-system, "Segoe UI", Roboto, Arial; margin:0; padding:1rem; background:#f6f8fb; color:#0b2136}
    .wrap{max-width:1100px;margin:0 auto}
    header{margin-bottom:1rem}
    h1{margin:.25rem 0}
    p.lead{color:#667}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
    .card{background:#fff;padding:6px;border-radius:8px;box-shadow:0 6px 18px rgba(11,33,54,0.06)}
    img{width:100%;height:auto;display:block;border-radius:6px}
    .muted{color:#667;font-size:.95rem}
    .center{text-align:center}
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>Credentials — Thumbnails</h1>
      <p class="lead">已自動產生的 PDF 縮圖（檔名為雜湊以保護原始檔名）。</p>
    </header>

    <section id="content">
      <p class="muted">載入縮圖中…</p>
    </section>

    <footer style="margin-top:1.5rem" class="muted center">
      Generated by sinwulok/credentials · Preview
    </footer>
  </main>

  <script>
    async function loadThumbnails() {
      const content = document.getElementById('content');
      try {
        const res = await fetch('./assets/thumbnails/index.json');
        if (!res.ok) throw new Error('index.json not found');
        const files = await res.json();
        if (!files || files.length === 0) {
          content.innerHTML = '<p class="muted">目前沒有縮圖。</p>';
          return;
        }
        const grid = document.createElement('div');
        grid.className = 'grid';
        files.forEach(fn => {
          const card = document.createElement('div');
          card.className = 'card';
          const img = document.createElement('img');
          img.src = './assets/thumbnails/' + fn;
          img.alt = fn;
          card.appendChild(img);
          grid.appendChild(card);
        });
        content.innerHTML = '';
        content.appendChild(grid);
      } catch (err) {
        content.innerHTML = '<p class="muted">無法載入縮圖索引：' + err.message + '</p>';
      }
    }
    // Disable cache when reloading during development in some browsers:
    if (location.search.indexOf('nocache') !== -1) {
      fetch('./assets/thumbnails/index.json', {cache: 'no-store'}).catch(()=>{});
    }
    loadThumbnails();
  </script>
</body>
</html>
