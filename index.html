<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>我的資歷 / My Credentials</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="wrap">
    <header>
      <h1>我的資歷 / My Credentials</h1>
      <p class="lead">持續學習的記錄 · Organized by issuer and series.</p>
      <div class="view-nav">
        <button class="view-btn active" disabled aria-current="page">📋 憑證清單</button>
        <a href="./gallery.html" class="view-btn">🖼 縮圖瀏覽</a>
      </div>
    </header>

    <section id="content" aria-live="polite">
      <p class="muted">載入資料中…</p>
    </section>

    <footer>
      Generated by <a href="https://github.com/sinwulok/credentials" target="_blank" rel="noopener noreferrer">sinwulok/credentials</a>
    </footer>
  </main>

  <script>
  'use strict';

  /* ── constants ── */
  const THUMB_PLACEHOLDER_HTML = '<span class="thumb-placeholder" aria-hidden="true">🎓</span>';

  /* ── type classification ── */
  const SPECIALIZATION_TYPES = [
    'specialization', 'professional-certificate', 'professional_certificate',
    'professional certificate', 'nanodegree', 'micromasters', 'microdegree',
    'certificate-program', 'certificate_program',
  ];
  const LEARNING_PATH_TYPES = [
    'learning-path', 'learning_path', 'learning path',
    'career-path', 'career_path', 'career path',
    'guided-project-series', 'path',
  ];

  function getCategoryKey(type) {
    const t = (type || '').toLowerCase().trim();
    if (SPECIALIZATION_TYPES.some(s => t === s || t.includes(s))) return 'specialization';
    if (LEARNING_PATH_TYPES.some(s => t === s || t.includes(s))) return 'learning-path';
    return 'specialization'; /* default: treat unknowns as specialization */
  }

  /* ── sort helper ── */
  function byOrderThenId(a, b) {
    return (a.order ?? 999999) - (b.order ?? 999999) || (a.id ?? 0) - (b.id ?? 0);
  }

  /* ── HTML escaping ── */
  function esc(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* ── rendering helpers ── */
  function renderTags(tags) {
    if (!Array.isArray(tags) || tags.length === 0) return '';
    return '<div class="cert-tags">' +
      tags.map(t => `<span class="tag">${esc(t)}</span>`).join('') +
      '</div>';
  }

  function renderVerifyBtn(url, small) {
    if (!url) return '';
    return `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer" class="verify-btn${small ? ' verify-btn--sm' : ''}">驗證</a>`;
  }

  function renderChildRow(child, num) {
    return `<tr>
      <td class="col-num">${num}</td>
      <td>
        <div class="child-title">${esc(child.title)}</div>
        ${child.type ? `<div class="child-type">${esc(child.type)}</div>` : ''}
      </td>
      <td class="col-date">${esc(child.issue_date)}</td>
      <td class="col-id">${esc(child.credential_id)}</td>
      <td>${renderVerifyBtn(child.verification_url, true)}</td>
    </tr>`;
  }

  function renderChildrenSection(children) {
    if (!children || children.length === 0) return '';
    const count = children.length;
    return `<div class="children-section">
      <div class="children-header">
        <span class="children-label">子項目 / SUB-CERTIFICATES</span>
        <button class="toggle-btn" data-count="${count}" aria-expanded="false">
          ▼ 展示 ${count} 個子項目
        </button>
      </div>
      <div class="children-wrapper" hidden>
        <table class="children-table">
          <thead>
            <tr>
              <th class="col-num">#</th>
              <th>子項目名稱 / Sub-certificate</th>
              <th class="col-date">發證日期</th>
              <th class="col-id">憑證編號</th>
              <th>驗證</th>
            </tr>
          </thead>
          <tbody>
            ${children.map((c, i) => renderChildRow(c, i + 1)).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
  }

  function renderParentCert(cert, children) {
    const thumbHtml = cert.thumbnail
      ? THUMB_PLACEHOLDER_HTML +
        `<img src="./assets/thumbnails/${esc(cert.thumbnail)}" alt="${esc(cert.title)}" loading="lazy" onerror="this.remove()">`
      : THUMB_PLACEHOLDER_HTML;

    return `<article class="parent-cert">
      <div class="cert-card">
        <div class="cert-thumbnail" aria-hidden="true">${thumbHtml}</div>
        <div class="cert-body">
          ${cert.type ? `<div class="cert-type-badge">🎓 ${esc(cert.type)}</div>` : ''}
          <h3 class="cert-title">${esc(cert.title)}</h3>
          ${cert.issuer ? `<div class="cert-issuer">${esc(cert.issuer)}</div>` : ''}
          ${renderTags(cert.tags)}
          <div class="cert-meta">
            ${cert.issue_date ? `<span class="cert-date">📅 ${esc(cert.issue_date)}</span>` : ''}
            ${cert.credential_id ? `<span class="cert-id">${esc(cert.credential_id)}</span>` : ''}
            ${renderVerifyBtn(cert.verification_url, false)}
          </div>
        </div>
      </div>
      ${renderChildrenSection(children)}
    </article>`;
  }

  function renderSection(titleEn, titleZh, icon, certs, childrenByParentId) {
    if (certs.length === 0) return '';
    return `<section class="category-section">
      <h2 class="category-title">${icon} ${titleZh} / ${titleEn}</h2>
      <div class="cert-list">
        ${certs.map(c => renderParentCert(c, childrenByParentId[c.id] || [])).join('')}
      </div>
    </section>`;
  }

  /* ── main loader ── */
  async function loadCredentials() {
    const content = document.getElementById('content');
    try {
      const res = await fetch('./data/credentials.json');
      if (!res.ok) throw new Error('credentials.json not found (' + res.status + ')');
      const data = await res.json();

      if (!Array.isArray(data) || data.length === 0) {
        content.innerHTML = '<p class="muted center">目前尚無憑證資料。</p>';
        return;
      }

      /* ── build parent-child map ── */
      const parents = [];
      const childrenByParentId = {};

      for (const rec of data) {
        if (rec.visibility === 'hidden') continue;

        const isChild = rec.group_role === 'sup' && rec.parent_id != null && rec.parent_id !== '';
        if (isChild) {
          const pid = String(rec.parent_id);
          if (!childrenByParentId[pid]) childrenByParentId[pid] = [];
          childrenByParentId[pid].push(rec);
        } else {
          parents.push(rec);
        }
      }

      /* sort children by order then id */
      for (const kids of Object.values(childrenByParentId)) {
        kids.sort(byOrderThenId);
      }

      /* ── categorise parents ── */
      const specializations = [];
      const learningPaths = [];

      for (const p of parents) {
        if (getCategoryKey(p.type) === 'learning-path') {
          learningPaths.push(p);
        } else {
          specializations.push(p);
        }
      }

      specializations.sort(byOrderThenId);
      learningPaths.sort(byOrderThenId);

      /* ── render ── */
      const html =
        renderSection('Specialization', '專業認證', '🎓', specializations, childrenByParentId) +
        renderSection('Learning Path', '學習路徑', '🛤', learningPaths, childrenByParentId);

      content.innerHTML = html || '<p class="muted center">目前尚無憑證資料。</p>';

      /* ── toggle handlers ── */
      content.querySelectorAll('.toggle-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const section = btn.closest('.children-section');
          const wrapper = section.querySelector('.children-wrapper');
          const expanded = btn.getAttribute('aria-expanded') === 'true';
          const count = btn.dataset.count || 0;
          if (expanded) {
            wrapper.hidden = true;
            btn.setAttribute('aria-expanded', 'false');
            btn.textContent = '▼ 展示 ' + count + ' 個子項目';
          } else {
            wrapper.hidden = false;
            btn.setAttribute('aria-expanded', 'true');
            btn.textContent = '▲ 隱藏 ' + count + ' 個子項目';
          }
        });
      });

    } catch (err) {
      content.innerHTML = '<p class="muted">無法載入憑證資料：' + esc(err.message) + '</p>';
    }
  }

  loadCredentials();
  </script>
</body>
</html>
