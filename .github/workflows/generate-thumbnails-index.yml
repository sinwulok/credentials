name: Generate thumbnails index on deploy

on:
  workflow_run:
    workflows: ["Build thumbnails from private files and deploy Pages"]
    types: [completed]

permissions:
  contents: read
  pages: write

jobs:
  build-index:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Build thumbnails index.json
        run: |
          mkdir -p public/assets/thumbnails
          python - <<'PY'
          import os, json
          src = "assets/thumbnails"
          dst = "public/assets/thumbnails"
          if os.path.isdir(src):
              imgs = [f for f in os.listdir(src) if f.lower().endswith(".png")]
              imgs.sort()
              with open(os.path.join(dst, "index.json"), "w") as fh:
                  json.dump(imgs, fh)
              print(f"Wrote {len(imgs)} entries to {dst}/index.json")
          else:
              print("No thumbnails directory found; no index created.")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
