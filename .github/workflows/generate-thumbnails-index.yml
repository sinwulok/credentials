name: Generate thumbnails index on deploy

on:
  workflow_run:
    workflows: ["Build thumbnails from private PDFs and deploy Pages"]
    types: [completed]

jobs:
  build-index:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          persist-credentials: true
          fetch-depth: 0

      - name: Build thumbnails index.json
        run: |
          python - <<'PY'
          import os, json
          p = "assets/thumbnails"
          if os.path.isdir(p):
              imgs = [f for f in os.listdir(p) if f.lower().endswith(".png")]
              imgs.sort()
              with open(os.path.join(p, "index.json"), "w") as fh:
                  json.dump(imgs, fh)
              print(f"Wrote {len(imgs)} entries to {p}/index.json")
          else:
              print(f"Directory not found: {p}")
          PY

      - name: Commit and push index.json (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git status --porcelain | grep -q "assets/thumbnails/index.json"; then
            git add assets/thumbnails/index.json
            git commit -m "Add/update thumbnails index.json (generated by workflow)"
            git push origin gh-pages
            echo "Pushed index.json to gh-pages"
          else
            echo "No changes to commit."
          fi
