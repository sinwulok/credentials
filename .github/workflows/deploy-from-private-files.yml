name: Build thumbnails from private files and deploy Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # <-- This line allows manual triggering

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # NOTE: Maintainers must update the repository secret value.
      # Change secret PRIVATE_PDFS_REPO to PRIVATE_FILES_REPO in GitHub settings,
      # or update the existing PRIVATE_PDFS_REPO secret value to point to the renamed repository.
      PRIVATE_FILES_REPO: ${{ secrets.PRIVATE_FILES_REPO }} # e.g. sinwulok/private-files
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout private files repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_FILES_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: private-files

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate thumbnails & redact (from private files)
        run: |
          mkdir -p docs/assets/thumbnails
          python scripts/generate_thumbnails_and_redact.py --input-dir private-files --out-dir docs/assets/thumbnails --patterns-file config/redact_patterns.json

      - name: Build thumbnails index (for deploy)
        run: |
          python - <<'PY'
          import os, json
          p = "docs/assets/thumbnails"
          if os.path.isdir(p):
            imgs = [f for f in os.listdir(p) if f.lower().endswith(".png")]
            imgs.sort()
            os.makedirs(p, exist_ok=True)
            with open(os.path.join(p, "index.json"), "w") as fh:
                json.dump(imgs, fh)
            print(f"Wrote {len(imgs)} entries to {p}/index.json")
          else:
              print(f"Directory not found: {p}")
          PY

      - name: Build docs index
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
          fi
          node scripts/build-index.js || echo "no build-index.js"

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: false
