name: Build thumbnails from private REPOS and deploy Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PRIVATE_FILES_REPO: ${{ secrets.PRIVATE_FILES_REPO }} # e.g. sinwulok/private-repos
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout private files repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_FILES_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: private-files

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: List private-files/credentials (debug)
        run: |
          echo "Listing private-files/credentials directory:"
          ls -la private-files/credentials/ || echo "Directory not found: private-files/credentials. Verify private repo checkout and directory structure."

      - name: Ingest descriptive data
        run: |
          python scripts/ingest_private_files.py --input-dir private-files/credentials --out-dir docs/data

      - name: Generate thumbnails & redact (from private PDFs)
        run: |
          mkdir -p docs/assets/thumbnails
          python scripts/generate_thumbnails_and_redact.py --input-dir private-files --out-dir docs/assets/thumbnails --patterns-file config/redact_patterns.json

      - name: Build thumbnails index
        run: |
          python - <<'PY'
          import os, json
          p = "docs/assets/thumbnails"
          if os.path.isdir(p):
            imgs = [f for f in os.listdir(p) if f.lower().endswith(".png")]
            imgs.sort()
            os.makedirs(p, exist_ok=True)
            with open(os.path.join(p, "index.json"), "w") as fh:
                json.dump(imgs, fh)
            print(f"Wrote {len(imgs)} entries to {p}/index.json")
          else:
              print(f"Directory not found: {p}")
          PY

      - name: Build docs index
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
          fi
          node scripts/build-index.js || echo "no build-index.js"

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: docs/
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: ./site

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: false
