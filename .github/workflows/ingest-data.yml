name: Ingest credentials data (artifact)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  PRIVATE_FILES_REPO: ${{ secrets.PRIVATE_FILES_REPO }}

jobs:
  ingest:
    name: Ingest (private-files -> docs/data)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repo (credentials)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PRIVATE_FILES_REPO secret
        run: |
          if [ -z "${{ secrets.PRIVATE_FILES_REPO }}" ]; then
            echo "ERROR: secrets.PRIVATE_FILES_REPO is empty. Set it in repo Settings -> Secrets.";
            exit 1;
          fi
        shell: bash

      - name: Checkout private files repo (if configured)
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_FILES_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: private-files

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: (Optional) Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python deps (if any)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        shell: bash

      - name: Run ingest script -> generate docs/data
        run: |
          mkdir -p docs/data
          # ensure script receives optional search-root to map source files
          python scripts/ingest_private_files.py --input-dir private-files/credentials --out-dir docs/data
        shell: bash

      - name: List generated data (debug)
        run: |
          echo "=== docs/data ==="
          if [ -d docs/data ]; then ls -la docs/data; else echo "docs/data not present"; fi
          echo "=== thumbnails (if any) ==="
          if [ -d docs/assets/thumbnails ]; then ls -la docs/assets/thumbnails; else echo "docs/assets/thumbnails not present"; fi
        shell: bash

      - name: Upload generated data & reports as artifact
        uses: actions/upload-artifact@v4
        with:
          name: credentials-data
          path: |
            docs/data
            docs/assets/thumbnails
            reports

  deploy_pages:
    name: Deploy generated docs to GitHub Pages (official)
    needs: ingest
    runs-on: ubuntu-latest
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: site
  
      - name: Inspect downloaded site (debug)
        run: |
          echo "site/ listing:"
          ls -la site || true
          echo "site/docs listing:"
          ls -la site/docs || true
        shell: bash
  
      - name: Upload pages artifact (official)
        uses: actions/upload-pages-artifact@v1
        with:
          path: site/docs
  
      - name: Deploy to GitHub Pages (official)
        uses: actions/deploy-pages@v1
