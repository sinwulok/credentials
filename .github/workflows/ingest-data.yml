name: Ingest credentials data (artifact)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIVATE_FILES_REPO: ${{ secrets.PRIVATE_FILES_REPO }}

jobs:
  ingest:
    name: Ingest (private-files -> docs/data)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repo (credentials)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout private files repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_FILES_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: private-files

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Optional: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python deps (if any)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        shell: bash

      - name: Debug: show private-files layout
        run: |
          echo "PRIVATE_FILES_REPO=${{ env.PRIVATE_FILES_REPO }}"
          echo "root listing of private-files:"
          ls -la private-files || true
          echo "files directory (if present):"
          ls -la private-files/files || true
          echo "credentials directory (if present):"
          ls -la private-files/files/credentials || ls -la private-files/credentials || true
        shell: bash

      - name: Run ingest script -> produce docs/data + reports + thumbnails mapping
        run: |
          mkdir -p docs/data
          # pass --search-root so script can look for source PDFs under private-files
          python scripts/ingest_private_files.py --input-dir private-files/files/credentials --out-dir docs/data --search-root private-files
        shell: bash

      - name: List generated outputs (debug)
        run: |
          echo "=== docs/data ==="
          ls -la docs/data || true
          echo "=== thumbnails ==="
          ls -la docs/assets/thumbnails || true
          echo "=== reports ==="
          ls -la reports || true
        shell: bash

      - name: Upload generated data & reports as artifact
        uses: actions/upload-artifact@v4
        with:
          name: credentials-data
          path: |
            docs/data
            docs/assets/thumbnails || true
            reports || true
