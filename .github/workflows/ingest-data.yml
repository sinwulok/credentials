name: Ingest credentials data (artifact)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIVATE_FILES_REPO: ${{ secrets.PRIVATE_FILES_REPO }}

jobs:
  ingest:
    name: Ingest (private-files -> docs/data)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repo (credentials)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout private files repo (if configured)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_FILES_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: private-files

      - name: Debug: inspect checked-out private-files
        run: |
          echo "---- Env ----"
          echo "PRIVATE_FILES_REPO=${{ env.PRIVATE_FILES_REPO }}"
          echo "---- listing private-files root ----"
          ls -la private-files || echo "private-files not present"
          echo "---- listing private-files/files (if exists) ----"
          ls -la private-files/files || echo "private-files/files not present"
          echo "---- listing private-files/credentials (if exists) ----"
          ls -la private-files/credentials || echo "private-files/credentials not present"
          echo "---- git info for private-files ----"
          if [ -d private-files/.git ]; then
            git -C private-files rev-parse --abbrev-ref HEAD || true
            git -C private-files log -1 --pretty=format:'%h %s (%an)' || true
            git -C private-files remote -v || true
          else
            echo "private-files is not a git repo or .git missing"
          fi
        shell: bash

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: (Optional) Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python deps (if any)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        shell: bash

      - name: Run ingest script -> generate docs/data
        run: |
          mkdir -p docs/data
          # ensure script receives optional search-root to map source files
          python scripts/ingest_private_files.py --input-dir private-files/credentials --out-dir docs/data --search-root private-files
        shell: bash

      - name: List generated data (debug)
        run: |
          echo "=== docs/data ==="
          ls -la docs/data || true
          echo "=== thumbnails (if any) ==="
          ls -la docs/assets/thumbnails || true
        shell: bash

      - name: Upload generated data & reports as artifact
        uses: actions/upload-artifact@v4
        with:
          name: credentials-data
          path: |
            docs/data
            docs/assets/thumbnails || true
            reports || true
